name: Evaluar misión 03 en Arena
on:
  push:
    paths:
      - 'game-packs/aws-event-driven/**'
      - '.github/workflows/app-integration-tests.yml'
  workflow_dispatch:
    inputs:
      retry:
        description: Reintentar una entrega fallida o bloqueada del mismo commit
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  evaluate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARENA_URL: ${{ vars.ARENA_URL || 'https://arena.costacorp.net' }}
      ARENA_EVENT_ID: ${{ vars.ARENA_EVENT_ID }}
      ARENA_RETRY: ${{ github.event_name == 'workflow_dispatch' && inputs.retry || false }}
    steps:
      - name: Solicitar evaluación y seguir el progreso
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, build_opener, HTTPRedirectHandler

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = build_opener(NoRedirect)
          arena = os.environ['ARENA_URL'].rstrip('/')
          event = os.environ['ARENA_EVENT_ID'].strip()
          if not event:
              sys.exit('Configura la variable ARENA_EVENT_ID en Settings > Secrets and variables > Actions > Variables.')
          identity = None
          expires = 0

          def oidc():
              global identity, expires
              if identity and time.time() < expires - 30:
                  return identity
              url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              url += ('&' if '?' in url else '?') + urlencode({'audience': arena})
              request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with opener.open(request, timeout=20) as response:
                  identity = json.load(response)['value']
              # Expiration schedules refresh only; Arena verifies the signature and all claims.
              payload = identity.split('.')[1]
              expires = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))['exp']
              return identity

          def api(path, body=None):
              request = Request(arena + '/api/v1/actions/' + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + oidc(), 'Content-Type': 'application/json', 'User-Agent': 'CloudOps-Arena-Actions/1.0'})
              try:
                  with opener.open(request, timeout=30) as response:
                      if 'application/json' not in response.headers.get('Content-Type', ''):
                          sys.exit('Arena no devolvió JSON. El instructor debe habilitar el acceso de Actions en Cloudflare Access.')
                      return json.load(response)
              except HTTPError as error:
                  if error.code in (301, 302, 303, 307, 308):
                      sys.exit('Cloudflare Access requiere inicio de sesión. El instructor debe configurar la ruta /api/v1/actions/*.')
                  try:
                      detail = json.load(error).get('detail', 'Solicitud rechazada.')
                  except (ValueError, AttributeError):
                      detail = 'Revisa el acceso de Cloudflare y la disponibilidad de Arena.'
                  sys.exit(f'Arena ({error.code}): {detail}')
              except URLError:
                  sys.exit('No se pudo conectar con Arena. Consulta con el instructor.')

          result = api('evaluations', {'event_id': event, 'mission_id': 'mission-03',
              'retry': os.environ['ARENA_RETRY'].lower() == 'true'})
          if result.get('already_completed'):
              print(result['message'])
              sys.exit(0)
          delivery = result['evaluation']
          print('Solicitud: ' + delivery['evaluation_id'], flush=True)
          seen = set()
          last_queue = None
          deadline = time.monotonic() + 50 * 60
          while True:
              position = delivery.get('queue_position')
              if delivery['status'] == 'pending' and position and position != last_queue:
                  print(f"En cola del evento: posición {position} de {delivery['queue_total']}. No envíes otra entrega.", flush=True)
                  last_queue = position
              for stage in delivery.get('progress', []):
                  key = (stage['stage'], stage['status'], stage['timestamp'])
                  if key not in seen:
                      print(f"{stage['message']}: {stage['status']}", flush=True)
                      seen.add(key)
              if delivery['status'] in ('passed', 'failed', 'blocked'):
                  print(delivery.get('message', delivery['status']), flush=True)
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('### Evaluación de Arena\n\nEstado: ' + delivery['status'] + '\n\n')
                      summary.write('Solicitud: `' + delivery['evaluation_id'] + '`\n\n')
                      summary.write('Puntos de esta entrega: ' + str(delivery.get('points_awarded', 0)) + '\n')
                  sys.exit(0 if delivery['status'] == 'passed' else 1)
              if time.monotonic() > deadline:
                  sys.exit('La evaluación sigue pendiente. Consulta su estado en Arena; no envíes otra entrega mientras esté en curso.')
              time.sleep(5)
              delivery = api('evaluations/' + event + '/' + delivery['evaluation_id'])['evaluation']
          PY
